[workspace]
authors = ["Nickolas K Freeman <nick.freeman524@gmail.com>"]
channels = ["conda-forge"]
name = "flowsim"
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]

[tasks]
test = "python -m pytest -q"
lint = "ruff check flowsim examples tests"
format = "ruff format flowsim examples tests"
format-check = "ruff format --check flowsim examples tests"
notebook-check = "marimo check --strict examples/lesson.py"
typecheck = "pyright flowsim examples"
check = { depends-on = ["test", "lint", "format-check", "notebook-check", "typecheck"] }
demo = "python -m examples.run_examples"
notebook = "marimo edit examples/lesson.py"
notebook-export = "marimo export html -f examples/lesson.py -o output/lesson.html"
# Fail when Marimo replaced an output with its size warning, which pyproject.toml's
# output_max_bytes prevents for the lesson viewers.
lesson-check = { cmd = "python -c \"import pathlib, sys; html = pathlib.Path('output/lesson.html').read_text(encoding='utf-8'); sys.exit('output/lesson.html has a Marimo size warning.' if 'too large for marimo' in html else 0)\"", depends-on = ["notebook-export"] }
exercise = "python -m examples.service_day"
extensions = "python -m examples.extensions"
operations = "python -m examples.operations"
supply-chain = "python -m examples.supply_chain"
# Run every example end to end, including the notebook, after behavioral changes.
examples = { depends-on = ["demo", "exercise", "extensions", "operations", "supply-chain", "lesson-check"] }
# Render a video in manim/ with its own environment (see manim/README.md).
manim-render = { cmd = "pixi run --manifest-path manim/pixi.toml render" }
# Time a long run, the service-day comparison, and its dashboard (benchmarks/bench.py).
bench = { cmd = "python benchmarks/bench.py --repeat 3", env = { POLARS_MAX_THREADS = "4", OMP_NUM_THREADS = "4" } }
bench-run = { cmd = "python benchmarks/bench.py --case run", env = { POLARS_MAX_THREADS = "4", OMP_NUM_THREADS = "4" } }
bench-compare = { cmd = "python benchmarks/bench.py --case compare", env = { POLARS_MAX_THREADS = "4", OMP_NUM_THREADS = "4" } }
bench-dashboard = { cmd = "python benchmarks/bench.py --case dashboard", env = { POLARS_MAX_THREADS = "4", OMP_NUM_THREADS = "4" } }

[dependencies]
python = ">=3.12,<3.14"
numpy = ">=2.5.4,<3"
polars = ">=2.0.0,<3"
networkx = ">=3.7,<4"
plotly = ">=7.1.0,<8"
scipy = ">=1.18.1,<2"
marimo = ">=0.25.1,<0.26"
pytest = ">=9.1.1,<10"
ruff = ">=0.17.0,<0.18"
setuptools = ">=84.0.0,<85"
pytest-timeout = ">=2.4.0,<3"
pyright = ">=1.1.414,<2"
nodejs = ">=20"

[pypi-dependencies]
classroom-flowsim = { path = ".", editable = true }
playwright = ">=1.64.0, <2"

# Measurement tools for the code-health review. memray has no Windows build.
# The pins below hold this environment to the default environment's versions,
# so coverage and mutation runs test the same stack students use.
[feature.code-health.dependencies]
coverage = ">=7.17.2,<8"
pytest-cov = ">=7.1.0,<8"
mutmut = ">=3.8.0,<4"
python = "==3.13.16"
polars = "==2.0.0"
polars-runtime-32 = "==2.0.0"
narwhals = "==2.27.1"
pytest = "==9.1.1"
pluggy = "==1.6.0"
ruff = "==0.17.0"
setuptools = "==84.0.0"

[feature.code-health.pypi-dependencies]
playwright = "==1.64.0"

[feature.code-health.target.linux-64.dependencies]
memray = ">=1.20.0,<2"

[feature.code-health.target.osx-arm64.dependencies]
memray = ">=1.20.0,<2"

[feature.code-health.target.osx-64.dependencies]
memray = ">=1.20.0,<2"

[environments]
code-health = { features = ["code-health"] }
